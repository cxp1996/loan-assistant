name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILDOZER_ALLOW_ROOT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
      
      - name: Set up Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            libssl-dev libffi-dev \
            python3-dev python3-pip \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            autoconf automake build-essential \
            wget curl cmake pkg-config \
            libgl1-mesa-dev libgles2-mesa-dev libosmesa6-dev
      
      - name: Set up Java
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
      
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33
      
      - name: Accept Android licenses
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee /usr/local/lib/android/sdk/licenses/android-sdk-license
      
      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 90
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loan-assistant-apk
          path: bin/*.apk
      
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
