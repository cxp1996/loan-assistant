name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ghcr.io/kivy/buildozer:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
      
      - name: Build APK
        run: |
          # 确保 SDK 许可证已接受
          mkdir -p /root/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /root/.android/android-sdk-license
          
          # 清理并构建
          buildozer android clean || true
          buildozer -v android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loan-assistant-apk
          path: bin/*.apk
          if-no-files-found: error
