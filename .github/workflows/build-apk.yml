name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  BUILDOZER_ALLOW_ROOT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      
      - name: Install system dependencies
        run: |
          # 先更新包列表
          sudo apt-get update -qq
          
          # 安装基础工具
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            wget curl cmake pkg-config \
            autoconf automake build-essential \
            openjdk-17-jdk-headless
          
          # 安装 Python 开发库
          sudo apt-get install -y --no-install-recommends \
            libssl-dev libffi-dev \
            python3-dev python3-pip
          
          # 安装 SDL2 相关库
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev
          
          # 安装多媒体库
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good
          
          # 安装 OpenGL 库
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libgles2-mesa-dev libosmesa6-dev
          
          # 设置 Java 环境
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
      
      - name: Install Buildozer and dependencies
        run: |
          # 升级 pip
          python -m pip install --upgrade pip setuptools wheel
          
          # 安装 Cython 和 Buildozer
          pip install --user Cython==0.29.33 buildozer==1.5.0
          
          # 添加到 PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> ~/.android/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
      
      - name: Clean previous builds
        run: |
          rm -rf .buildozer
          rm -rf bin
          buildozer android clean || true
      
      - name: Build APK
        run: |
          buildozer -v android debug
        timeout-minutes: 90
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loan-assistant-apk
          path: bin/*.apk
          if-no-files-found: error
      
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: Build #${{ github.run_number }} - ${{ github.event.head_commit.message }}
          body: |
            自动构建的 APK 文件
            
            构建时间：${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
